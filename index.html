<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Le tirage des petits papiers en ligne : gérez les participants, posez vos règles d'exclusion et lancez un tirage au sort équitable en un clic."
    />
    <meta name="theme-color" content="#1d1d4b" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d4b'/%3E%3Crect x='6.5' y='9' width='11' height='14' rx='2' transform='rotate(-8 12 16)' fill='%23a3b6fd'/%3E%3Crect x='14.5' y='9' width='11' height='14' rx='2' transform='rotate(8 20 16)' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Les Petits Papiers — Tirage au sort</title>
    <script>
      (function () {
        var lang = 'fr';
        try {
          var stored = localStorage.getItem('sp_lang');
          if (stored === 'fr' || stored === 'en') {
            lang = stored;
          } else {
            var preferred =
              (navigator.languages && navigator.languages[0]) ||
              navigator.language ||
              'fr';
            lang = preferred.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
          }
        } catch (e) {}
        document.documentElement.lang = lang;
      })();

      (function () {
        try {
          var stored = localStorage.getItem('sp_theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
